[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "out" }]

[profile.ci]
fuzz = { runs = 10_000 }
invariant = { runs = 1_000, depth = 100 }
verbosity = 4

[fmt]
line_length = 120

[lint]
exclude_lints = ["mixed-case-function"]
