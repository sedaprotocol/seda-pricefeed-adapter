name: "⚡ Push"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # PRs run the lighter `pr` profile; pushes to main run the deep `ci` profile.
  FOUNDRY_PROFILE: ${{ github.event_name == 'push' && 'ci' || 'pr' }}
  # Fail the test step if a stored gas snapshot drifts.
  FORGE_SNAPSHOT_CHECK: true

jobs:
  checks:
    name: "🔍 Checks"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: "Check out the repo 📥"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive
          persist-credentials: false

      # Pin the Foundry *release* (not `stable`, which drifts). `forge fmt` output
      # changes between versions — CI must match dev machines or fmt --check flaps.
      - name: "Install Foundry"
        uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10 # v1.7.0
        with:
          version: v1.7.0

      # The OpenZeppelin Foundry Upgrades plugin shells out to
      # `npx @openzeppelin/upgrades-core` over FFI to validate UUPS implementations
      # (initializer + ERC-7201 namespaced storage layout). Node must be on PATH
      # for `Upgrades.deployUUPSProxy` / `Upgrades.upgradeProxy` calls in tests
      # and scripts to succeed. SHA-pinned for reproducibility.
      - name: "Install Node (for OZ Upgrades validator)"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*

      - name: "Show Forge version"
        run: |
          echo "Foundry profile: $FOUNDRY_PROFILE"
          forge --version
          node --version
          npx --version

      - name: "Check formatting 🧹"
        run: forge fmt --check

      - name: "Compile the contracts 🛠️"
        run: forge build

      - name: "Check contract sizes (src only) 📏"
        run: forge build --sizes src/*

      # `forge clean && forge build` guarantees a single, full build_info artifact
      # for the OZ Upgrades validator. Incremental builds emit partial build_infos
      # the validator rejects with "is not from a full compilation".
      - name: "Run tests 🧪"
        run: forge clean && forge build && forge test --isolate -vvv

      # `--no-match-coverage` keeps the report focused on production code: deploy/
      # upgrade scripts and the V2 mocks under `script/mocks/` are broadcast/test
      # fixtures, not contract logic, and would otherwise skew the totals (0% rows
      # for scripts, 100% for mocks). Filtering at the forge layer means both the
      # summary and lcov.info are pre-filtered, so no downstream `lcov --remove` is
      # needed. Keep the regex in sync with `justfile`'s `coverage` recipe.
      - name: "Run coverage 🧪"
        env:
          # Coverage doesn't need deep fuzzing; use default profile for speed.
          FOUNDRY_PROFILE: default
        run: forge coverage --report summary --report lcov --no-match-coverage '(script|test|lib)/'

      - name: "Upload LCOV artifact"
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

      # `zgosalvez/github-actions-report-lcov` shells out to `genhtml` (from the
      # `lcov` Debian/Ubuntu package); ubuntu-latest images do not include it.
      - name: "Install lcov (genhtml)"
        if: github.event_name == 'pull_request'
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: "Add coverage PR comment + enforce threshold 💬"
        if: github.event_name == 'pull_request'
        uses: zgosalvez/github-actions-report-lcov@v5
        with:
          coverage-files: lcov.info
          # Floor sits 1% below the current src/ line coverage (100%) so a
          # single accidental uncovered line doesn't flap CI. Ratchet upward as
          # the suite grows; do not lower it.
          minimum-coverage: 99
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: code-coverage-html-report
          title-prefix: "Foundry "
